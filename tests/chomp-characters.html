<!doctype html><meta charset="utf-8"><title>CHOMP character checks</title><style>body{background:#30284e;color:white;font:16px system-ui}main{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.character{position:relative}.character svg{width:100%;height:auto}.burst{display:none}h2{font-size:16px}</style><button id="close">Closed frames</button><button id="open">Reload open frames</button><main></main><script type="module">import {CHARACTERS} from '../games/chomp/characters.js';import {mountCreature} from '../games/chomp/creature.js';const views=[];for(const c of CHARACTERS){const article=document.createElement('article');const title=document.createElement('h2');title.textContent=c.name;const host=document.createElement('div');host.className='character';article.append(title,host);document.querySelector('main').append(article);const v=mountCreature(host,()=>{});views.push(v);await v.load(c.theme);}document.querySelector('#close').onclick=()=>views.forEach(v=>v.close());document.querySelector('#open').onclick=()=>location.reload();</script>
