<!doctype html><html><head><meta charset="utf-8"><title>Editor semantic checks</title><link rel="icon" href="data:,"></head><body><button id="run">Check word and emoji validation</button><pre id="result"></pre><iframe id="editor" style="width:390px;height:844px"></iframe><script type="module">
import {setRepository} from '../shared/sets.js';
const out=document.querySelector('#result'),frame=document.querySelector('#editor'),wait=async fn=>{for(let i=0;i<100;i++){if(fn())return;await new Promise(r=>setTimeout(r,70));}throw Error('Timed out');};const assert=(v,m)=>{if(!v)throw Error(m);};document.querySelector('#run').onclick=async()=>{let fixture;try{const base=await setRepository.get('animals-1');fixture=await setRepository.create({...base,name:'__Semantic regression'});frame.src='../sets/editor.html?id='+fixture.id;await wait(()=>frame.contentDocument?.querySelector('[aria-label="Word 1"]'));const d=frame.contentDocument,w=frame.contentWindow,word=d.querySelector('[aria-label="Word 1"]'),emoji=d.querySelector('[aria-label="Emoji 1"]');const fill=(input,value)=>{input.value=value;input.dispatchEvent(new w.Event('input',{bubbles:true}));};fill(word,'🐱');assert(word.getAttribute('aria-invalid')==='true'&&word.parentElement.textContent.includes('Enter a word'),'Emoji-only word not flagged inline');d.querySelector('#saveSet').click();await wait(()=>d.querySelector('#message').textContent.includes('Enter a word'));assert(d.querySelector('#playSet').disabled,'Invalid set playable');fill(word,'cat');fill(emoji,'cat');assert(emoji.getAttribute('aria-invalid')==='true'&&emoji.parentElement.textContent.includes('Enter an emoji'),'Plain text emoji not flagged');d.querySelector('#saveSet').click();await wait(()=>d.querySelector('#message').textContent.includes('Enter an emoji'));fill(emoji,'👩🏽‍🏫');d.querySelector('#saveSet').click();await wait(()=>d.querySelector('#saveState').textContent==='Saved');assert(!d.querySelector('#playSet').disabled,'Corrected set still blocked');out.textContent='ALL SEMANTIC EDITOR CHECKS PASSED';}catch(e){out.textContent='FAIL: '+e.message;console.error(e);}finally{frame.src='about:blank';if(fixture)await setRepository.delete(fixture.id);}};
</script></body></html>
