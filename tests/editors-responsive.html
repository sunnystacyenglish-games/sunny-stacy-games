<!doctype html><title>Responsive editors</title><button id="run">Run mobile editor checks</button><pre></pre><iframe style="width:390px;height:700px"></iframe><script type="module">
const frame=document.querySelector('iframe'),out=document.querySelector('pre'),pause=ms=>new Promise(r=>setTimeout(r,ms));document.querySelector('button').onclick=async()=>{try{for(const type of ['bridge','scene','sentenceCorrection','cardDecks']){frame.src='editor-demo.html?type='+type;await new Promise(r=>frame.onload=r);await pause(80);const d=frame.contentDocument;if(d.documentElement.scrollWidth>390)throw Error(type+' overflow');if(type==='sentenceCorrection'){const fields=d.querySelectorAll('.sentence-fields label');if(fields[1].getBoundingClientRect().top<fields[0].getBoundingClientRect().bottom)throw Error('Fields did not stack');}if(type==='scene'){if(d.querySelector('.scene-prompts').getBoundingClientRect().top<d.querySelector('.scene-background-column').getBoundingClientRect().bottom)throw Error('Prepare columns did not stack');[...d.querySelectorAll('button')].find(b=>b.textContent==='Next').click();await pause(80);if(d.documentElement.scrollWidth>390)throw Error('Arrange overflow');if(d.querySelector('.scene-canvas').clientWidth<300)throw Error('Scene too small');}out.textContent+='PASS '+type+' at 390px\n';}out.textContent+='ALL MOBILE EDITOR CHECKS PASSED';}catch(e){out.textContent+='FAIL '+e.stack;console.error(e);}};
</script>
