<!doctype html><meta charset="utf-8"><title>Hub responsive regression</title><button id="run">Run responsive checks</button><pre></pre><iframe style="height:850px;border:0"></iframe><script type="module">
const frame=document.querySelector('iframe'),out=document.querySelector('pre'),pause=ms=>new Promise(r=>setTimeout(r,ms));document.querySelector('#run').onclick=async()=>{out.textContent='';try{for(const width of [390,768,1280])for(const route of ['../','../updates/']){frame.style.width=width+'px';frame.src=route;await new Promise(r=>frame.onload=r);await pause(100);const d=frame.contentDocument,check=(x,m)=>{if(!x)throw Error(m);};check(d.documentElement.scrollWidth<=width,'Overflow '+width+route);check(d.querySelectorAll('.development-block').length===4,'Four sections');check(d.querySelector('#feedback a').href==='https://t.me/moreva_anastasia','Personal feedback');if(route==='../'){check(d.querySelectorAll('.released-game').length===6,'Six games');const urls=[...d.querySelectorAll('#socialLinks a')].map(a=>a.href);check(JSON.stringify(urls)===JSON.stringify(['https://t.me/sunnystacyenglish','https://www.youtube.com/@sunnystacy.english/shorts','https://www.threads.com/@sunnystacy.english']),'Exact socials');check(d.querySelector('.released-game').getBoundingClientRect().top<d.querySelector('[data-development]').getBoundingClientRect().top,'Catalog first');}out.textContent+='PASS '+route+' at '+width+'px\n';}out.textContent+='ALL RESPONSIVE CHECKS PASSED';}catch(e){out.textContent+='FAIL '+e.stack;}};
</script>
