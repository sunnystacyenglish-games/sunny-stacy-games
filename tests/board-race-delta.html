<!doctype html><html><head><meta charset="utf-8"><title>Board Race blur and die checks</title><link rel="stylesheet" href="../shared/styles.css"><link rel="stylesheet" href="../games/board-race/game.css"><style>body{padding:20px}#task{width:500px}#taskText{min-height:90px}#sample-controls{display:flex;gap:8px;flex-wrap:wrap}.race-controls{margin-top:20px;justify-content:start}#turn{display:block}</style></head><body><button id="run">Run blur checks</button><pre id="results"></pre><div id="sample-controls"><button id="word">Word Blur example</button><button id="picture">Picture Blur example</button><button id="nothing">Nothing example</button></div><div class="race-controls"><p id="turn">Ready</p><button id="roll" aria-label="Die"><span id="die"></span></button></div><div id="values"></div><dialog id="task"><div id="taskImage"></div><p id="taskText"></p><button id="reveal">Reveal Answer</button><button id="close">Close</button></dialog><script type="module">
import {createDie} from '../games/board-race/dice.js';import {renderConcept} from '../games/board-race/content-view.js';import {concealTask,revealTask} from '../shared/concept-blur.js';import {concealTask as tttConceal} from '../games/tic-tac-toe/task-presentation.js';
const $=id=>document.getElementById(id),die=createDie($('die')),task=$('task'),check=(v,m)=>{if(!v)throw Error(m);};$('reveal').onclick=()=>{revealTask(task);$('reveal').disabled=true;};$('close').onclick=()=>task.close();for(const [id,mode] of [['word','word-blur'],['picture','picture-blur'],['nothing','none']])$(id).onclick=()=>{renderConcept(task,{word:'Have you ever seen a star?',image:{type:'emoji',value:'⭐'}},mode);task.showModal();};
for(let n=1;n<=6;n++){const b=document.createElement('button');b.textContent='Roll '+n;b.onclick=async()=>{document.querySelectorAll('#values button').forEach(x=>x.disabled=true);$('turn').textContent='Sunny is rolling…';await die.roll(n,true);$('turn').textContent='Sunny rolled '+n+'!';document.querySelectorAll('#values button').forEach(x=>x.disabled=false);};$('values').append(b);}
$('run').onclick=()=>{const out=$('results');out.textContent='';try{check(concealTask===tttConceal,'Identical shared implementation');for(const mode of ['word-blur','picture-blur','none'])for(const word of ['star','Have you ever seen a star?']){const concept={word,image:{type:'emoji',value:'⭐'},prompt:'Unrelated Prompt must not be displayed'},saved=JSON.stringify(concept);renderConcept(task,concept,mode);task.showModal();const before=task.getBoundingClientRect();check(!task.textContent.includes('Unrelated Prompt'),'Concept excludes Prompt');check($('taskText').textContent===word,'Whole authored text');check(!$('taskText').hidden&&!$('taskImage').hidden,'Keep both layout regions');check($('taskText').classList.contains('concealed-answer')===(mode==='word-blur'),'Text blur');check($('taskImage').classList.contains('concealed-answer')===(mode==='picture-blur'),'Image blur');if(mode!=='none')$('reveal').click();const after=task.getBoundingClientRect();check(before.width===after.width&&before.height===after.height,'Stable reveal dimensions');check(!task.querySelector('.concealed-answer'),'Revealed');check(JSON.stringify(concept)===saved,'Saved content unchanged');task.close();out.textContent+='PASS '+mode+' / '+word+'\n';}for(const concept of [{word:'Only text'},{image:{type:'emoji',value:'⭐'}}]){renderConcept(task,concept,'word-blur');check(!$('taskText').hidden||!$('taskImage').hidden,'Incomplete concept fallback');check(!task.querySelector('.concealed-answer'),'Available component visible');}out.textContent+='ALL BLUR CHECKS PASSED';}catch(e){out.textContent+='FAIL '+e.stack;console.error(e);}};
</script></body></html>
