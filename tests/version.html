<!doctype html><html><head><meta charset="utf-8"><title>Version checks</title><link rel="icon" href="data:,"></head><body><button id="run">Check version indicators</button><pre id="result"></pre><iframe id="frame" title="Version page" style="height:760px"></iframe><script type="module">
const out=document.querySelector('#result'),frame=document.querySelector('#frame');const wait=async fn=>{for(let i=0;i<100;i++){if(fn())return;await new Promise(r=>setTimeout(r,80));}throw Error('Timed out');};
document.querySelector('#run').onclick=async()=>{out.textContent='';try{const pkg=await fetch('../package.json').then(r=>r.json());for(const width of [390,1280])for(const page of ['../','../sets/','../sets/editor.html','../games/dobble/?set=animals-1&movement=off']){frame.style.width=width+'px';frame.src=page;await new Promise(r=>frame.onload=r);await wait(()=>frame.contentDocument.querySelector('body>.app-version'));const doc=frame.contentDocument,badge=doc.querySelector('body>.app-version'),style=frame.contentWindow.getComputedStyle(badge),r=badge.getBoundingClientRect();if(badge.textContent!=='Sunny & Stacy Games · v'+pkg.version||style.pointerEvents!=='none'||r.right>width||r.left<0)throw Error('Incorrect indicator '+page);out.textContent+='PASS: '+width+' '+page+'\n';if(page==='../sets/'){await wait(()=>doc.querySelector('article[aria-label="Animals 1"] button'));doc.querySelector('article[aria-label="Animals 1"] button').click();await wait(()=>doc.querySelector('dialog[open]>.app-version'));if(frame.contentWindow.getComputedStyle(badge).visibility!=='hidden')throw Error('Duplicate visible badge');out.textContent+='PASS: pre-game indicator\n';}}out.textContent+='ALL VERSION CHECKS PASSED';}catch(e){out.textContent+='FAIL: '+e.message;console.error(e);}};
</script></body></html>
