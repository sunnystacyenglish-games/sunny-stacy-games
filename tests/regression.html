<!doctype html><html><head><title>Regression suite</title><link rel="icon" href="data:,"></head><body><button id="run">Run regressions</button><pre id="result"></pre><iframe id="test" style="width:1280px;height:900px"></iframe><script type="module">const out=document.querySelector('#result'),f=document.querySelector('#test');document.querySelector('#run').onclick=async()=>{out.textContent='';for(const page of ['browser','editor-inputs','editor-semantics','pregame','version','layout','flexible']){f.src=page+'.html';await new Promise(r=>f.onload=r);f.contentDocument.querySelector('#run').click();let result='';for(let i=0;i<900;i++){await new Promise(r=>setTimeout(r,250));result=f.contentDocument.querySelector('#result').textContent;if(/FAIL:|ALL .*PASSED/.test(result))break;}out.textContent+=page+': '+result+'\n';if(!/ALL .*PASSED/.test(result)){out.textContent+='STOPPED';return;}}out.textContent+='ALL REGRESSIONS PASSED';};</script></body></html>
