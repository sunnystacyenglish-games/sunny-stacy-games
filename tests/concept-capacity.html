<!doctype html><meta charset="utf-8"><title>Concept capacity checks</title><button id="run">Run concept capacity checks</button><pre></pre><iframe style="width:390px;height:740px"></iframe><script type="module">
import {setRepository} from '../shared/sets.js';import {importSet} from '../shared/transfer.js';const f=document.querySelector('iframe'),out=document.querySelector('pre'),check=(v,m)=>{if(!v)throw Error(m);},pause=ms=>new Promise(r=>setTimeout(r,ms));let set;
document.querySelector('button').onclick=async()=>{try{const items=Array.from({length:70},(_,i)=>({id:'legacy'+i,word:'cat',image:{type:'emoji',value:'🐱'}}));let rejected=false;try{await setRepository.create({name:'Over cap',items});}catch{rejected=true;}check(rejected,'New over-cap set saved');set=await importSet(JSON.stringify({schema:'sunny-stacy-content-set',version:1,set:{name:'__Legacy capacity',items}}));check(set.items.length===70,'Legacy import truncated');set.items[0].word='kitten';await setRepository.update(set.id,set);f.src='../sets/editor.html?id='+set.id;await new Promise(r=>f.onload=r);const d=f.contentDocument;for(let n=0;n<100&&!d.querySelector('#capacityCount').textContent;n++)await pause(20);check(d.querySelector('#addItem').disabled,'Legacy Add enabled');check(d.querySelector('#capacityCount').textContent==='70 / 50','Count not explicit');check(d.querySelectorAll('.item-row').length===70,'Legacy data hidden');set.items.push({id:'new',word:'dog',image:{type:'emoji',value:'🐶'}});rejected=false;try{await setRepository.update(set.id,set);}catch{rejected=true;}check(rejected,'Legacy set grew beyond capacity');out.textContent='PASS new cap 50, legacy 70-item JSON import/edit preserved, 70 / 50 visible, Add disabled, growth rejected';}catch(e){out.textContent='FAIL '+e.stack;console.error(e);}finally{if(set)await setRepository.delete(set.id);}};
</script>
