<!doctype html><meta charset="utf-8"><title>Mobile gameplay preview</title><style>body{margin:0;background:#e8edf1;font:14px system-ui}header{height:36px;display:flex;align-items:center;gap:15px;padding:0 12px}main{display:flex;gap:10px;padding:0 10px}iframe{width:390px;height:650px;border:0;flex:none;border-radius:12px}</style><header><button id="run">Prepare mobile preview</button><span>390 × 650 · Wordly + Story Dice</span><output></output></header><main><iframe id="word"></iframe><iframe id="dice"></iframe></main><script type="module">const pause=ms=>new Promise(r=>setTimeout(r,ms));async function wait(fn){for(let i=0;i<200;i++){if(fn())return;await pause(20);}throw Error('Timeout');}document.querySelector('button').onclick=async()=>{const keys=['sunny-stacy.wordly.settings.v1','sunny-stacy.story-dice.settings.v1'],saved=keys.map(k=>localStorage.getItem(k));try{const w=document.querySelector('#word'),s=document.querySelector('#dice');w.src='../games/wordly/?set=animals-1&length=8&selection=mastery&sound=false&theme=space';await new Promise(r=>w.onload=r);await wait(()=>w.contentDocument.querySelector('#setup')?.open);w.contentDocument.querySelector('#play').click();w.contentDocument.querySelector('#keyboardToggle').click();s.src='../games/story-dice/?mode=sentence&sound=false&theme=magic-school';await new Promise(r=>s.onload=r);await wait(()=>s.contentDocument.querySelector('#setup')?.open);s.contentDocument.querySelector('#play').click();for(let i=0;i<3;i++)for(const category of ['subject','action','object','where','how','time']){s.contentDocument.querySelector('[data-category='+category+']').click();await pause(80);}await wait(()=>!s.contentDocument.querySelector('.rolling'));document.querySelector('output').textContent='Ready';}finally{keys.forEach((k,i)=>saved[i]===null?localStorage.removeItem(k):localStorage.setItem(k,saved[i]));}};</script>
