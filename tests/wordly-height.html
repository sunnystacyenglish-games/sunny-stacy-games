<!doctype html><meta charset="utf-8"><title>Short viewport checks</title><button id="run">Run mobile-height checks</button><pre></pre><iframe></iframe><script type="module">
import{setRepository,newId}from'../shared/sets.js';const f=document.querySelector('iframe'),out=document.querySelector('pre'),pause=ms=>new Promise(r=>setTimeout(r,ms));let d,set;const $=s=>d.querySelector(s),check=(v,m)=>{if(!v)throw Error(m);};async function wait(fn){for(let i=0;i<200;i++){if(fn())return;await pause(20);}throw Error('Timeout');}function fits(w,h){check(d.documentElement.scrollHeight<=d.documentElement.clientHeight+1&&d.documentElement.scrollWidth<=w+1,'Page scroll '+w+'x'+h);for(const e of [...d.querySelectorAll('.game-header,#clue,#attemptLabel,.tile,.wordly-controls button,#lockedStatus'),...($('#keyboard').hidden?[]:d.querySelectorAll('#keyboard button'))]){if(e.hidden)continue;const r=e.getBoundingClientRect();check(r.left>=-1&&r.top>=-1&&r.right<=w+1&&r.bottom<=h+1,'Clipped '+e.className+' '+e.id+' '+w+'x'+h+' '+JSON.stringify(r.toJSON()));}const grid=$('#grid').getBoundingClientRect(),first=$('.tile').getBoundingClientRect(),last=[...d.querySelectorAll('.tile')].at(-1).getBoundingClientRect();check(Math.abs(grid.width-(last.right-first.left))<12&&Math.abs(grid.height-(last.bottom-first.top))<12,'Oversized glow');}
document.querySelector('button').onclick=async()=>{const key='sunny-stacy.wordly.settings.v1',saved=localStorage.getItem(key);try{set=await setRepository.create({name:'__Short viewport',items:['elephant','two words','ice-cream','polar bear','another phrase'].map(word=>({id:newId(),word,image:{type:'emoji',value:'🐘'}}))});for(const [w,h] of [[390,650],[390,560],[360,640],[320,568],[844,320],[390,844],[1024,768]]){f.style.width=w+'px';f.style.height=h+'px';f.src='../games/wordly/?set='+set.id+'&sound=false&selection=random';await new Promise(r=>f.onload=r);d=f.contentDocument;await wait(()=>$('#setup')?.open);$('#play').click();await pause(150);fits(w,h);$('#keyboardToggle').click();await pause(150);fits(w,h);$('#keyboardToggle').click();await pause(100);const vv=f.contentWindow.visualViewport;Object.defineProperty(vv,'height',{configurable:true,value:Math.min(340,h)});vv.dispatchEvent(new Event('resize'));await pause(150);fits(w,Math.min(340,h));out.textContent+='PASS '+w+'x'+h+' complete 8x5 grid, custom keyboard, visual viewport shrink to '+Math.min(340,h)+'px\n';}out.textContent+='ALL SHORT VIEWPORT CHECKS PASSED';}catch(e){out.textContent+='FAIL '+e.stack;console.error(e);}finally{if(set)await setRepository.delete(set.id);saved===null?localStorage.removeItem(key):localStorage.setItem(key,saved);}};
</script>
