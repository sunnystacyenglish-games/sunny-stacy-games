<!doctype html><meta charset="utf-8"><title>Wordly clack timing</title><button id="run">Run reveal/carry audio checks</button><pre></pre><iframe style="width:800px;height:700px"></iframe><script type="module">
import{setRepository,newId}from'../shared/sets.js';const f=document.querySelector('iframe'),out=document.querySelector('pre'),pause=ms=>new Promise(r=>setTimeout(r,ms));let d,set,events=[];const $=s=>d.querySelector(s),check=(v,m)=>{if(!v)throw Error(m);};async function wait(fn){for(let i=0;i<300;i++){if(fn())return;await pause(20);}throw Error('Timeout');}function native(text){$('#nativeInput').value=' '+text;$('#nativeInput').dispatchEvent(new InputEvent('input',{bubbles:true,inputType:'insertText',data:text}));$('#nativeInput').dispatchEvent(new KeyboardEvent('keydown',{key:'Enter',bubbles:true,cancelable:true}));}
document.querySelector('button').onclick=async()=>{const key='sunny-stacy.wordly.settings.v1',saved=localStorage.getItem(key);try{set=await setRepository.create({name:'__Clack timing',items:['cat','two words','ice-cream','polar bear','long phrase'].map(word=>({id:newId(),word,image:{type:'emoji',value:'🐱'}}))});f.src='../games/wordly/?set='+set.id+'&sound=true&selection=random';await new Promise(r=>f.onload=r);d=f.contentDocument;await wait(()=>$('#setup')?.open);const prototype=f.contentWindow.AudioBufferSourceNode.prototype,original=prototype.start;prototype.start=function(...args){events.push({type:'tile',time:performance.now(),revealing:!!$('.revealing'),duration:this.buffer.duration});const ended=this.onended;this.onended=()=>{events.push({type:'ended',time:performance.now()});ended?.();};return original.apply(this,args);};f.contentWindow.Audio=class{currentTime=0;volume=1;constructor(src){this.src=src;}play(){events.push({type:this.src.includes('victory')?'victory':'feedback',time:performance.now()});return Promise.resolve();}pause(){}};$('#play').click();await pause(100);native('CAZ');await wait(()=>d.body.dataset.state==='INPUT');check(events.filter(e=>e.type==='tile').length===4,'Expected 3 reveal + ONE two-green carry clack');check($('.letter-row.active').textContent.replaceAll('✓','')==='CA','Carry lost letters');out.textContent+='PASS three tile clacks + one carry clack for two simultaneous green letters\n';events=[];native('T');await wait(()=>$('#result').open);check(events.filter(e=>e.type==='tile').length===3,'Victory reveal clacks');const victory=events.findIndex(e=>e.type==='victory');check(victory>=0&&events.slice(victory+1).every(e=>e.type!=='tile'&&e.type!=='ended'),'Stray clack after victory');check(events.slice(0,victory).filter(e=>e.type==='ended').length===3,'Victory before sound ended');out.textContent+='PASS three reveals finish before victory, no carry on winning row and no delayed clack\n';$('#nextWord').click();$('#settingsOpen').click();$('#sound').checked=false;$('#sound').dispatchEvent(new Event('change'));$('#setupForm').requestSubmit();events=[];native('CAT');await wait(()=>$('#result').open);check(events.length===0,'Sound OFF');out.textContent+='PASS Sound OFF\nALL WORDLY CLACK TIMING CHECKS PASSED';}catch(e){out.textContent+='FAIL '+e.stack;console.error(e);}finally{if(set)await setRepository.delete(set.id);saved===null?localStorage.removeItem(key):localStorage.setItem(key,saved);}};
</script>
