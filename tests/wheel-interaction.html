<!doctype html><meta charset="utf-8"><title>Wheel interaction check</title><link rel="stylesheet" href="../shared/game-system.css"><style>body{--border:#aaa;--bg:white;--soft:#def;--ink:#123;font:16px sans-serif;padding:20px}.wheel-picker{box-sizing:border-box;width:240px}pre{margin-top:25px}</style><div id="picker"></div><pre id="value">Selected: B</pre><script type="module">import{createWheelPicker}from'../shared/wheel-picker.js';const p=createWheelPicker({value:'b',label:'Test picker',options:'ABCDEFG'.split('').map((label,i)=>({value:label.toLowerCase(),label,disabled:i===2})),onChange:v=>document.querySelector('pre').textContent='Selected: '+v.toUpperCase()});document.querySelector('#picker').append(p.element);p.setValue('b');</script>
