<!doctype html><html lang="en"><meta charset="utf-8"><title>Activity editor contract check</title><link rel="stylesheet" href="../shared/styles.css"><link rel="stylesheet" href="../shared/setup-menu.css"><button id="run">Run activity editor check</button><pre id="output"></pre><dialog id="setup"><form id="form"><h2 id="title">Test-only content adapter</h2><label>Theme<select id="theme"><option value="notebook">Notebook</option></select></label><label>Sound<input id="sound" type="checkbox"></label><label id="gameplay">Attempts<input type="number" value="2"></label><div id="footer"><button type="button" id="close">Cancel</button></div></form></dialog><script type="module">
import {mountSetupMenu} from '../shared/setup-menu.js';
import {createActivityRegistry} from '../shared/activity/registry.js';
import {createActivity} from '../shared/activity/definition.js';
const $=id=>document.getElementById(id),check=(ok,msg)=>{if(!ok)throw Error(msg);};
$('run').onclick=()=>{try{
 const registry=createActivityRegistry();registry.registerContent({type:'fixture',version:1,validate:()=>{},resolve:data=>data,editor:'fixture'});registry.registerGame({id:'fixture-game',supportedContentTypes:['fixture'],normalizeGameplay:r=>r,editors:{fixture:'fixture'},capabilities:{customEditor:true}});
 let input,disposed=false;registry.registerEditor('fixture',({host,activity})=>{const label=document.createElement('label');label.textContent='Activity-specific content';input=document.createElement('input');input.value=activity.content.data.text;label.append(input);host.append(label);return {read:()=>({text:input.value}),cancel(){input.value=activity.content.data.text;},destroy(){disposed=true;}};});
 const activity=createActivity({name:'Editor extension fixture',gameType:'fixture-game',content:{type:'fixture',version:1,data:{text:'Author content'}}},registry);
 const controller=mountSetupMenu({registry,gameType:activity.gameType,activity,dialog:$('setup'),form:$('form'),title:$('title'),themeSelect:$('theme'),sound:$('sound'),gameplay:[$('gameplay')],footer:$('footer'),committedTheme:()=> 'notebook'});
 $('setup').showModal();check($('setup').querySelectorAll('[role=tab]').length===3,'Shared tabs missing');check(!$('setup').querySelector('.setup-library'),'Custom editor depends on Concept Sets');input.value='Draft edit';check(controller.readContent().text==='Draft edit','Editor read failed');check(activity.content.data.text==='Author content','Author data mutated');
 for(const tab of $('setup').querySelectorAll('[role=tab]'))tab.click();$('setup').querySelector('[data-tab=content]').click();check(input.value==='Draft edit','Tab switching lost draft');$('output').textContent='PASS custom content editor inside shared Content / Themes / Gameplay shell, no set selector required, detached author data, stable draft across tabs';$('close').onclick=()=>{$('setup').close();controller.destroy();check(disposed,'No cleanup');};
}catch(e){$('output').textContent='FAIL '+e.stack;console.error(e);}};
</script></html>
