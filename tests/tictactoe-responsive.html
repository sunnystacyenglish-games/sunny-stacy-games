<!doctype html><html><head><title>Tic-Tac-Toe responsive checks</title></head><body><button id="run">Check responsive tasks</button><pre id="result"></pre><iframe id="f" style="border:0"></iframe><script type="module">
import {setRepository,newId} from '../shared/sets.js';const f=document.querySelector('iframe'),out=document.querySelector('pre'),pause=ms=>new Promise(r=>setTimeout(r,ms));const wait=async fn=>{for(let i=0;i<120;i++){if(fn())return;await pause(30);}throw Error('Timed out');};const check=(v,m)=>{if(!v)throw Error(m);};document.querySelector('button').onclick=async()=>{out.textContent='';let set;const saved=localStorage.getItem('sunny-stacy.tictactoe.settings.v1');try{const base=await setRepository.get('animals-1');set=await setRepository.create({name:'__TTT responsive',items:base.items.slice(0,5).map(i=>({...i,id:newId(),word:'Describe what you see. Use a full sentence, then ask your partner a question about this picture. What do you think?'}))});for(const [w,h] of [[390,844],[412,915],[844,390],[915,412],[820,1180],[1024,768],[1366,768],[1920,1080]]){f.style.width=w+'px';f.style.height=h+'px';f.src='../games/tic-tac-toe/?set='+set.id+'&sound=false';await new Promise(r=>f.onload=r);const d=f.contentDocument;await wait(()=>d.querySelector('#setup').open);d.querySelector('#play').click();await wait(()=>!d.querySelector('#playArea').hidden);d.querySelectorAll('.cell')[4].click();await wait(()=>d.querySelector('#task').open);await pause(100);for(const id of ['board','task','correct','incorrect']){const r=d.querySelector('#'+id).getBoundingClientRect();check(r.top>=0&&r.bottom<=h&&r.left>=0&&r.right<=w,id+' clipped '+w+'x'+h);}check(d.documentElement.scrollWidth<=w,'overflow');const a=d.querySelector('#task').getBoundingClientRect(),b=d.querySelector('.pending').getBoundingClientRect();check(Math.min(a.right,b.right)<=Math.max(a.left,b.left)||Math.min(a.bottom,b.bottom)<=Math.max(a.top,b.top),'pending cell hidden '+w+'x'+h);out.textContent+='PASS '+w+'×'+h+' full board, task controls and visible pending square\n';}out.textContent+='ALL RESPONSIVE TASK CHECKS PASSED';}catch(e){out.textContent+='FAIL: '+e.message;console.error(e);}finally{if(set)await setRepository.delete(set.id);if(saved===null)localStorage.removeItem('sunny-stacy.tictactoe.settings.v1');else localStorage.setItem('sunny-stacy.tictactoe.settings.v1',saved);}};</script></body></html>
