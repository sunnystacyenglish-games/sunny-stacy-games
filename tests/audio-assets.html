<!doctype html><meta charset="utf-8"><title>Audio assets verification</title><button id="run">Verify supplied audio</button><pre></pre><script type="module">
const out=document.querySelector('pre');document.querySelector('button').onclick=async()=>{out.textContent='';try{const context=new AudioContext();for(const name of ['ui-click','tile-clack','wrong-soft-buzz','victory','correct-chime','dice-roll']){const response=await fetch('../assets/audio/'+name+'.mp3');if(!response.ok)throw Error(name+' unavailable');const buffer=await context.decodeAudioData(await response.arrayBuffer());out.textContent+='PASS '+name+' decoded '+buffer.duration.toFixed(3)+'s, '+buffer.numberOfChannels+' channels\n';}await context.close();out.textContent+='ALL AUDIO ASSETS DECODED';}catch(e){out.textContent+='FAIL '+e.stack;}};
</script>
