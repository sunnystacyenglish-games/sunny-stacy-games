<!doctype html><meta charset="utf-8"><title>Existing winding route</title><style>svg{display:block;border:1px solid #ccc;margin:15px}</style><div id="boards"></div><script type="module">import {generateBoard} from '../games/board-race/geometry.js';for(const mode of ['race','endless'])for(const size of [12,24,40]){const g=generateBoard({size,mode,layout:'winding',width:1000,height:400,random:()=>.5}),h=document.createElement('h2');h.textContent=mode+' '+size;const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.setAttribute('viewBox','0 0 1000 400');svg.style.width='1000px';const path=document.createElementNS(svg.namespaceURI,'polyline');path.setAttribute('points',g.curve.map(p=>p.x+','+p.y).join(' '));path.setAttribute('fill','none');path.setAttribute('stroke','#ddd');svg.append(path);for(const [i,p] of g.points.entries()){const c=document.createElementNS(svg.namespaceURI,'circle');c.setAttribute('cx',p.x);c.setAttribute('cy',p.y);c.setAttribute('r',g.diameter/2);c.setAttribute('fill','#fff');c.setAttribute('stroke','#555');svg.append(c);const t=document.createElementNS(svg.namespaceURI,'text');t.textContent=i;t.setAttribute('x',p.x);t.setAttribute('y',p.y);svg.append(t);}document.querySelector('#boards').append(h,svg);}</script>
