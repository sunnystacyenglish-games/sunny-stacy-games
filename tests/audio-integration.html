<!doctype html><meta charset="utf-8"><title>Victory integration</title><button id="run">Run victory checks</button><pre></pre><iframe style="width:1024px;height:768px"></iframe><script type="module">
import {setRepository,newId} from '../shared/sets.js';
const f=document.querySelector('iframe'),out=document.querySelector('pre'),pause=ms=>new Promise(r=>setTimeout(r,ms));let d,players;const $=s=>d.querySelector(s),check=(v,m)=>{if(!v)throw Error(m);};async function wait(fn){for(let i=0;i<300;i++){if(fn())return;await pause(20);}throw Error('Timeout');}
async function open(game,set,sound){f.src='../games/'+game+'/?set='+set+'&sound='+sound;await new Promise(r=>f.onload=r);d=f.contentDocument;await wait(()=>$('#setup').open);players=[];f.contentWindow.Audio=class{currentTime=0;volume=1;paused=true;constructor(src){this.src=src;players.push(this);}play(){this.paused=false;return Promise.resolve();}pause(){this.paused=true;}};$('#play').click();await wait(()=>!$('#setup').open);}
async function win(game){if(game==='wordly'){for(const key of ['c','a','t','Enter'])$('#grid').dispatchEvent(new KeyboardEvent('keydown',{key,bubbles:true,cancelable:true}));}else{for(const cell of [0,3,1,4,2]){$('#cells').children[cell].click();await wait(()=>$('#task').open&&!$('#correct').disabled);$('#correct').click();await wait(()=>d.body.dataset.state==='SELECT_CELL'||$('#result').open);}}await wait(()=>$('#result').open);}
document.querySelector('#run').onclick=async()=>{let fixture;const keys=['sunny-stacy.wordly.settings.v1','sunny-stacy.tictactoe.settings.v1'],saved=keys.map(k=>localStorage.getItem(k));try{fixture=await setRepository.create({name:'__Audio integration',items:['cat','two words','ice-cream','polar bear','very long phrase'].map(word=>({id:newId(),word,image:{type:'emoji',value:'🐱'}}))});for(const game of ['wordly','tic-tac-toe']){await open(game,game==='wordly'?fixture.id:'animals-1',true);await win(game);const victory=players.find(p=>p.src.endsWith('/victory.mp3'));check(victory&&!victory.paused&&victory.volume===1,'Victory did not start at unity');victory.currentTime=2.99;await pause(50);check(victory.volume===1,'Early fade');victory.currentTime=3.6;await pause(50);check(Math.abs(victory.volume-.5)<.01,'Fade missing');$(game==='wordly'?'#nextWord':'#again').click();check(victory.paused&&victory.currentTime===0&&victory.volume===1,'Next round leaves audio');await win(game);check(!victory.paused&&victory.currentTime===0&&victory.volume===1,'Repeat not reset');victory.currentTime=4.21;await pause(50);check(victory.paused&&victory.currentTime===0,'Fade end not stopped');await open(game,game==='wordly'?fixture.id:'animals-1',false);await win(game);check(players.length===0,'Sound off playback');out.textContent+='PASS '+game+' victory asset, unity start, 3s hold, 1.2s fade, immediate next-round stop, repeat reset, sound OFF\n';}out.textContent+='ALL VICTORY INTEGRATION CHECKS PASSED';}catch(e){out.textContent+='FAIL '+e.stack;console.error(e);}finally{if(fixture)await setRepository.delete(fixture.id);keys.forEach((k,i)=>saved[i]===null?localStorage.removeItem(k):localStorage.setItem(k,saved[i]));}};
</script>
