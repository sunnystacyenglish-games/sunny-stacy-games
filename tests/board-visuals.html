<!doctype html><meta charset="utf-8"><title>Board visual checks</title><style>body{margin:0;font:14px system-ui}button,select{margin:4px}iframe{display:block;border:0;width:100%;height:650px}</style><select id="theme"><option>notebook</option><option>board-game</option><option>candy</option><option>ocean</option><option>nature</option><option>space</option><option>chalkboard</option><option>magic-school</option></select><select id="layout"><option>winding</option><option>spiral</option><option>horizontal-snake</option><option>vertical-snake</option><option>double-notch</option><option>opposing-notches</option><option>folded-rectangle</option></select><select id="mode"><option>race</option><option>endless</option></select><select id="style"><option>tiles</option><option>circles</option></select><select id="size"><option>12</option><option>20</option><option>30</option><option selected>40</option></select><select id="viewport"><option>738x650</option><option>390x740</option><option>740x360</option><option>820x1000</option></select><button id="show">Show board</button><iframe title="Actual game preview"></iframe><pre></pre><script type="module">
const f=document.querySelector('iframe'),pause=ms=>new Promise(r=>setTimeout(r,ms));
document.querySelector('#show').onclick=async()=>{const [width,height]=document.querySelector('#viewport').value.split('x');f.style.width=width+'px';f.style.height=height+'px';const key='sunny-stacy.board-race.settings.v1',saved=localStorage.getItem(key);f.src='../games/board-race/?set=animals-1&mode='+document.querySelector('#mode').value+'&size='+size.value+'&style='+document.querySelector('#style').value+'&special=false&players=2&theme='+theme.value+'&sound=false';await new Promise(r=>f.onload=r);const d=f.contentDocument;for(let n=0;n<100&&!d.querySelector('#setup')?.open;n++)await pause(30);const families=['winding','spiral','horizontal-snake','vertical-snake','double-notch','opposing-notches','folded-rectangle'].filter(x=>document.querySelector('#mode').value!=='endless'||x!=='spiral');f.contentWindow.Math.random=()=>Math.max(0,families.indexOf(layout.value))/families.length+.001;d.querySelector('#setupForm').requestSubmit();for(let n=0;n<100&&!d.querySelector('#pawns').open;n++)await pause(30);d.querySelector('#startGame').click();await pause(1100);if(saved===null)localStorage.removeItem(key);else localStorage.setItem(key,saved);const b=d.querySelector('#board').getBoundingClientRect();document.querySelector('pre').textContent=JSON.stringify({layout:d.querySelector('#board').dataset.layout,width:b.width,height:b.height,background:f.contentWindow.getComputedStyle(d.querySelector('#board')).backgroundColor});};
</script>
