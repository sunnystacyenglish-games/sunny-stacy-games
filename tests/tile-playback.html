<!doctype html><meta charset="utf-8"><title>Trimmed WAV playback checks</title><button id="run">Verify 8 tile reveals with real WAV</button><pre></pre><script type="module">
import{prepareTileClack,playTileClack,finishTileClack,stopTileClack}from'../shared/tile-audio.js';const ready=prepareTileClack(),out=document.querySelector('pre'),pause=ms=>new Promise(r=>setTimeout(r,ms));document.querySelector('button').onclick=async()=>{out.textContent='';try{await prepareTileClack(true);for(let i=0;i<8;i++){const node=playTileClack(true);if(!node||node.context.state!=='running'||!node.buffer)throw Error('No active PCM playback');const a=node.buffer.getChannelData(0),samples=Math.min(a.length,node.buffer.sampleRate*.09);let peak=0;for(let j=0;j<samples;j++)peak=Math.max(peak,Math.abs(a[j]));if(peak<.01)throw Error('First 90ms is silent');out.textContent+='PASS tile '+(i+1)+' actual WebAudio start, first 90ms peak '+peak.toFixed(3)+', duration '+node.buffer.duration.toFixed(3)+'s\n';await pause(90);}await finishTileClack();stopTileClack();if(playTileClack(false)!==null)throw Error('Muted audio');out.textContent+='ALL REAL WAV PLAYBACK CHECKS PASSED';}catch(e){out.textContent+='FAIL '+e.stack;}};
</script>
