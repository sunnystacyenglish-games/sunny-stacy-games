<!doctype html><meta charset="utf-8"><title>Board route checks</title><style>body{font:16px system-ui;background:#fff9ee}svg{width:700px;max-width:100%;height:auto}path,circle{stroke:#876;stroke-width:1;fill:#f2cc8f}text{font-size:12px;text-anchor:middle}select{font:inherit;margin:10px}</style><select id="layout"><option>winding</option><option>spiral</option><option>horizontal-snake</option><option>vertical-snake</option><option>double-notch</option><option>opposing-notches</option><option>folded-rectangle</option></select><select id="mode"><option>race</option><option>endless</option></select><select id="style"><option>tiles</option><option>circles</option></select><svg viewBox="0 0 700 400"></svg><pre></pre><script type="module">
import {windingBoard} from '../games/board-race/geometry.js';
function render(){const g=windingBoard({layout:layout.value,mode:mode.value,size:23,width:700,height:400});document.querySelector('svg').innerHTML=(style.value==='tiles'?g.segments.map(s=>`<path d="${s.path}"/>`).join(''):g.points.map(p=>`<circle cx="${p.x}" cy="${p.y}" r="${g.diameter/2}"/>`).join(''))+g.points.map((p,i)=>`<text x="${p.x}" y="${p.y}">${i}</text>`).join('');document.querySelector('pre').textContent=JSON.stringify({layout:g.layout,diameter:g.diameter});}for(const id of ['layout','mode','style'])document.getElementById(id).onchange=render;render();</script>
