<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hub updates checks</title><link rel="stylesheet" href="../shared/styles.css"><link rel="stylesheet" href="../shared/development.css"><button id="run">Run Hub checks</button><pre></pre><main id="fixture"></main><script type="module">
import {renderDevelopment} from '../shared/development.js';const host=document.querySelector('#fixture'),out=document.querySelector('pre');document.querySelector('#run').onclick=()=>{try{const check=(v,m)=>{if(!v)throw Error(m);};renderDevelopment(host,{data:{}});check(host.textContent.includes('No known issues reported right now.'),'Empty');const data={updates:Array.from({length:5},(_,i)=>({id:'u'+i,title:'Very long title '.repeat(25),description:'Long description '.repeat(25),date:'2026-10-0'+(i+1),published:true,verified:true,type:'Improved'})),knownIssues:Array.from({length:4},(_,i)=>({id:'b'+i,title:'Issue',status:'Known'})),roadmap:[{id:'r',title:'Feature',status:'Coming Next'}]};renderDevelopment(host,{data});check(host.querySelectorAll('#updates li').length===3,'Three latest');check(host.querySelectorAll('#known-issues li').length===3,'Three issues');check(host.querySelector('time').dateTime==='2026-10-05','Newest');check([...host.querySelectorAll('a')].some(a=>a.getAttribute('href')==='updates/#known-issues'),'All issues link');check(host.querySelector('#feedback a').href==='https://t.me/moreva_anastasia','Feedback exact');check(document.documentElement.scrollWidth<=innerWidth,'No long-content overflow');renderDevelopment(host,{data,full:true});check(host.querySelectorAll('#updates li').length===5,'Full history');data.knownIssues[0].status='Fixed';renderDevelopment(host,{data,full:true});check(host.querySelectorAll('#known-issues li').length===3,'Fixed hidden');check(host.querySelectorAll('#updates li').length===5,'No fabricated release');out.textContent='PASS empty states, latest three, complete history, long text, issue visibility, exact feedback and optional fields';}catch(e){out.textContent='FAIL '+e.stack;}};
</script>
