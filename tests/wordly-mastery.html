<!doctype html><meta charset="utf-8"><title>Wordly mastery and input</title><button id="run">Run mastery and input checks</button><pre></pre><iframe style="width:390px;height:700px"></iframe><script type="module">
import{setRepository,newId}from'../shared/sets.js';const f=document.querySelector('iframe'),out=document.querySelector('pre'),pause=ms=>new Promise(r=>setTimeout(r,ms));let d,set;const $=s=>d.querySelector(s),check=(v,m)=>{if(!v)throw Error(m);};async function wait(fn){for(let i=0;i<400;i++){if(fn())return;await pause(20);}throw Error('Timeout');}function native(text){const n=$('#nativeInput');n.value=' '+text;n.dispatchEvent(new f.contentWindow.InputEvent('input',{inputType:'insertText',data:text,bubbles:true}));}function enter(){const e=new f.contentWindow.InputEvent('beforeinput',{inputType:'insertLineBreak',bubbles:true,cancelable:true});$('#nativeInput').dispatchEvent(e);}async function submit(text){native(text);enter();await wait(()=>d.body.dataset.state!=='EVALUATING');}const word=()=>({'🐱':'CAT','🐶':'DOG','🦊':'FOX'}[$('#clue').textContent]);const active=()=>$('.letter-row.active').textContent.replace(/[✓↔×]/g,'');
document.querySelector('#run').onclick=async()=>{const pref='sunny-stacy.wordly.settings.v1',saved=localStorage.getItem(pref);try{set=await setRepository.create({name:'__Mastery input test',items:[['cat','🐱'],['dog','🐶'],['fox','🦊'],['two words','📝'],['ice-cream','🍦']].map(([word,value])=>({id:newId(),word,image:{type:'emoji',value}}))});f.src='../games/wordly/?set='+set.id+'&selection=mastery&sound=false';await new Promise(r=>f.onload=r);d=f.contentDocument;await wait(()=>$('#setup').open);check($('#selection').value==='mastery','Selection URL');$('#play').click();await wait(()=>d.body.dataset.state==='INPUT');check(d.activeElement===$('#nativeInput'),'New-word input focus');native('a');check(active()==='A','Input without keydown');$('#nativeInput').value='';$('#nativeInput').dispatchEvent(new f.contentWindow.InputEvent('input',{inputType:'deleteContentBackward',bubbles:true}));check(active()==='','Native backspace');$('#nativeInput').dispatchEvent(new CompositionEvent('compositionstart'));$('#nativeInput').value=' b';$('#nativeInput').dispatchEvent(new InputEvent('input',{isComposing:true,bubbles:true}));check(active()==='','Early composition');$('#nativeInput').dispatchEvent(new CompositionEvent('compositionend'));check(active()==='B','Composition missing');$('#nativeInput').dispatchEvent(new KeyboardEvent('keydown',{key:'Backspace',bubbles:true,cancelable:true}));$('#keyboardToggle').click();check(d.activeElement!==$('#nativeInput')&&$('#nativeInput').inputMode==='none','Custom summons native');$('[data-key=C]').click();check(active()==='C','Custom input');$('[data-key=Backspace]').click();$('#keyboardToggle').click();check(d.activeElement===$('#nativeInput')&&$('#nativeInput').inputMode==='text','Restore native focus');out.textContent+='PASS native input-only, delete, composition, Enter, custom keyboard isolation and focus\n';
const failed=word(),seen=[failed];for(let i=0;i<3;i++)await submit('ZZZ');check($('#result').open&&d.body.dataset.state==='FAILURE','Expected failure');$('#nextWord').click();for(let i=0;i<2;i++){const answer=word();check(!seen.includes(answer),'Early repeat');seen.push(answer);await submit(answer);check($('#resultTitle').textContent!=='You spelled them all! 🎉','Early completion');$('#nextWord').click();}check(word()===failed,'Failed word not retried after pass');await submit(failed);check($('#resultTitle').textContent==='You spelled them all! 🎉'&&$('#resultCopy').textContent==='3 words completed','Completion content');check($('#nextWord').textContent==='Play again','Restart label');$('#nextWord').click();check(d.body.dataset.state==='INPUT'&&active()==='','Mastery restart');out.textContent+='PASS initial coverage, failed-only next pass, successful removal, completion and restart\n';$('#hint').click();check($('#lockedStatus').textContent==='1 letter is locked in place.','Singular locked status');await pause(330);const answer=word(),letters=[...$('.letter-row.active').children].map((cell,i)=>cell.classList.contains('correct')?'':answer[i]).join('');await submit(letters);check($('#lockedStatus').textContent==='3 letters are locked in place.','Plural locked status');out.textContent+='PASS dynamic locked count\nALL MASTERY AND NATIVE INPUT CHECKS PASSED';}catch(e){out.textContent+='FAIL '+e.stack;console.error(e);}finally{if(set)await setRepository.delete(set.id);saved===null?localStorage.removeItem(pref):localStorage.setItem(pref,saved);}};
</script>
