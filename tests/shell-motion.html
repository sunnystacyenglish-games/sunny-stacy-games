<!doctype html><html><head><title>Shell movement continuity</title></head><body><button id="run">Check movement continuity</button><pre id="result"></pre><iframe id="frame" width="1366" height="768"></iframe><script type="module">const f=document.querySelector('iframe'),out=document.querySelector('pre'),pause=ms=>new Promise(r=>setTimeout(r,ms));document.querySelector('button').onclick=async()=>{const saved=localStorage.getItem('sunny-stacy.dobble.settings.v1');try{f.src='../games/dobble/?set=animals-1&movement=fast&autoNext=false&count=2&mode=images';await new Promise(r=>f.onload=r);for(let i=0;i<100&&!f.contentDocument.querySelector('.pregame[open]');i++)await pause(40);const d=f.contentDocument;[...d.querySelectorAll('.pregame button')].find(b=>b.textContent==='Play').click();await pause(600);const nodes=[...d.querySelectorAll('.item')],first=nodes.map(n=>n.style.left+':'+n.style.top),signature=nodes.map(n=>n.dataset.id+':'+n.dataset.scale+':'+n.style.getPropertyValue('--angle')).join('|'),cards=[...d.querySelectorAll('.card')],target=nodes.find(n=>cards[0].contains(n)&&[...cards[1].children].some(o=>o.dataset.id===n.dataset.id));await pause(400);const shell=d.querySelector('.game-shell');shell.dispatchEvent(new f.contentWindow.PointerEvent('pointerenter',{pointerType:'mouse'}));await pause(300);shell.dispatchEvent(new f.contentWindow.PointerEvent('pointerleave',{pointerType:'mouse'}));await pause(500);if(d.querySelector('#score').textContent!=='0'||nodes.some(n=>!n.isConnected)||signature!==[...d.querySelectorAll('.item')].map(n=>n.dataset.id+':'+n.dataset.scale+':'+n.style.getPropertyValue('--angle')).join('|'))throw Error('State changed');if(!nodes.some((n,i)=>n.style.left+':'+n.style.top!==first[i]))throw Error('Motion stopped');const css=await fetch('../shared/game-shell.css').then(r=>r.text());if(!css.includes('@media(prefers-reduced-motion:reduce){.game-shell{transition:none}}'))throw Error('Reduced motion rule missing');out.textContent='ALL SHELL MOTION CHECKS PASSED: same DOM nodes, IDs, sizes, angles and score; movement continues; reduced-motion CSS present';}catch(e){out.textContent='FAIL: '+e.message;}finally{if(saved===null)localStorage.removeItem('sunny-stacy.dobble.settings.v1');else localStorage.setItem('sunny-stacy.dobble.settings.v1',saved);}};</script></body></html>
