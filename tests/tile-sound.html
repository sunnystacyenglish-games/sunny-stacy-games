<!doctype html><meta charset="utf-8"><button id="run">Check tile sound</button><pre></pre><script type="module">document.querySelector('button').onclick=async()=>{const c=new AudioContext(),b=await c.decodeAudioData(await(await fetch('../assets/audio/tile-clack.mp3')).arrayBuffer()),a=b.getChannelData(0);let onset=-1,last=0,peak=0,bins=[];for(let i=0;i<a.length;i++){const v=Math.abs(a[i]);peak=Math.max(peak,v);if(v>.01){if(onset<0)onset=i/b.sampleRate;last=i/b.sampleRate;}}for(let t=0;t<b.duration;t+=.09){let p=0;for(let i=Math.floor(t*b.sampleRate);i<Math.min(a.length,(t+.09)*b.sampleRate);i++)p=Math.max(p,Math.abs(a[i]));bins.push([t.toFixed(2),p.toFixed(5)]);}document.querySelector('pre').textContent=JSON.stringify({duration:b.duration,onset,last,peak,bins},null,2);c.close();};</script>
