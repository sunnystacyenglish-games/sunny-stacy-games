<!doctype html><meta charset="utf-8"><title>Die interaction checks</title><button id="run">Run interaction checks</button><pre></pre><iframe style="width:390px;height:844px"></iframe><script type="module">
const f=document.querySelector('iframe'),out=document.querySelector('pre'),pause=ms=>new Promise(r=>setTimeout(r,ms));let d;const $=s=>d.querySelector(s),all=s=>[...d.querySelectorAll(s)],check=(v,m)=>{if(!v)throw Error(m);};async function wait(fn){for(let i=0;i<200;i++){if(fn())return;await pause(20);}throw Error('Timeout');}function bounds(){return all('.die').map(n=>JSON.stringify(n.getBoundingClientRect().toJSON())).join('|');}function menu(){const r=$('#dieActions').getBoundingClientRect();check(r.left>=0&&r.top>=0&&r.right<=390&&r.bottom<=844,'Menu outside viewport');check(all('#dieActions button').length===2,'Menu count');}
document.querySelector('#run').onclick=async()=>{const pref='sunny-stacy.story-dice.settings.v1',saved=localStorage.getItem(pref);try{for(const mode of ['story','concept','sentence']){f.src='../games/story-dice/?mode='+mode+'&set=animals-1&sound=false';await new Promise(r=>f.onload=r);d=f.contentDocument;await wait(()=>$('#setup').open);$('#play').click();check(!$('#empty').hidden&&$('#empty').textContent.includes('Click a die to reroll or remove it.'),'Empty instructions');$('[data-category]').click();await wait(()=>!$('.rolling'));await pause(400);check($('#empty').hidden,'Instruction remains');check(!$('.die button'),'Permanent actions');const die=$('.die');check(die.querySelector('.die-face').contains(die.querySelector('.die-label')),'Label external');check(die.querySelector('.die-face').contains(die.querySelector('.die-category')),'Category external');const before=bounds();die.click();menu();check(bounds()===before,'Opening moved dice');die.click();check($('#dieActions').hidden,'Retoggle');die.dispatchEvent(new KeyboardEvent('keydown',{key:'Enter',bubbles:true,cancelable:true}));menu();$('#dieActions').dispatchEvent(new KeyboardEvent('keydown',{key:'Escape',bubbles:true,cancelable:true}));check($('#dieActions').hidden&&d.activeElement===die,'Escape focus');$('[data-category]').click();await wait(()=>!$('.rolling'));await pause(400);const first=all('.die')[0],second=all('.die')[1];first.click();second.click();check(first.getAttribute('aria-expanded')==='false'&&second.getAttribute('aria-expanded')==='true','Switch menu');menu();d.body.dispatchEvent(new PointerEvent('pointerdown',{bubbles:true}));check($('#dieActions').hidden,'Outside close');first.click();const id=first.dataset.id;$('#dieActions button').click();check($('#dieActions').hidden,'Reroll menu open');await wait(()=>!$('.rolling'));check(all('.die').length===2&&$('.die').dataset.id===id,'Reroll identity');$('.die').click();$('#dieActions button:last-child').click();check($('#dieActions').hidden&&$('.removing'),'Remove animation/menu');await wait(()=>!$('.removing'));check(all('.die').length===1,'Remove count');$('#clear').click();check(!$('#empty').hidden,'Empty return');out.textContent+='PASS '+mode+' unified die, click/keyboard, switch/toggle/outside/Escape, stable geometry, safe menu, reroll/remove, empty state\n';}out.textContent+='ALL INTERACTION CHECKS PASSED';}catch(e){out.textContent+='FAIL '+e.stack;console.error(e);}finally{if(saved===null)localStorage.removeItem(pref);else localStorage.setItem(pref,saved);}};
</script>
