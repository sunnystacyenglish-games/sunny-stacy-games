<!doctype html><meta charset="utf-8"><title>Quiz layout review</title><button id="start">Open Quiz</button><button id="mobile">390 px</button><button id="tablet">806 px</button><button id="desktop">1100 px</button><pre id="result"></pre><iframe title="Quiz preview" style="width:806px;height:800px"></iframe><script type="module">
const frame=document.querySelector('iframe');document.querySelector('#start').onclick=async()=>{frame.src='../games/chomp/?contentMode=quiz&contentId=quiz-label-test-quiz&players=1&theme=ocean&sound=false&shuffleQuestions=false';await new Promise(r=>frame.onload=r);const d=frame.contentDocument;for(let i=0;i<200;i++){if(d.querySelector('#setup')?.open&&!d.querySelector('#play').disabled)break;await new Promise(r=>setTimeout(r,25));}d.querySelector('#play').click();};for(const [id,w] of [['mobile',390],['tablet',806],['desktop',1100]])document.querySelector('#'+id).onclick=()=>frame.style.width=w+'px';
</script>
