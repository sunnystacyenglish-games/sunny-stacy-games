<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>I Spy / Spot It | Sunny & Stacy Games</title><link rel="icon" href="../../shared/brand-mark.png"><link rel="stylesheet" href="../../shared/styles.css"><link rel="stylesheet" href="../../shared/game-shell.css"><link rel="stylesheet" href="../dobble/themes.css"><link rel="stylesheet" href="../../shared/game-system.css"><link rel="stylesheet" href="../../shared/setup-menu.css"><link rel="stylesheet" href="game.css"><script type="module" src="game.js"></script><script type="module" src="../../shared/game-shell.js"></script><script type="module" src="../../shared/app.js"></script></head><body class="dobble-page spy-page"><aside class="game-shell" data-game-shell data-open="false" aria-label="Game navigation"><button class="drawer-handle" aria-label="Game menu" aria-expanded="false" aria-controls="gameNavigation">›</button><div class="drawer-panel" id="gameNavigation" inert><a class="brand" href="../../">Sunny & Stacy Games</a><nav aria-label="Game controls"><a class="button" href="../../">← Games</a><a class="button" href="../../activities/">Content Studio</a><button id="chooseScene">Choose scene</button><button id="settingsOpen">⚙ Settings</button><button id="fullscreen">⛶ Fullscreen</button><button id="copyLink">Copy Game Link</button></nav><div class="drawer-footer" data-app-version></div></div></aside><main><div class="game-header"><h1>I Spy / Spot It</h1><span class="game-context" id="sceneName"></span></div><section id="empty"><h2>Explore your scene</h2><p>Choose a scene with targets to begin.</p><button id="chooseStart">Choose scene</button><a class="button" href="../../activities/">Create a scene</a></section><section id="errorPanel" role="alert" hidden><p id="errorText"></p><button id="retry">Try again</button><a class="button" href="../../activities/">Content Studio</a></section><section id="playArea" hidden><div class="target-header" aria-live="polite"><p id="progress"></p><h2 id="prompt"></h2><p id="counter"></p><span id="targetSuccess" hidden>✓ Well done!</span></div><p id="assetWarning" role="status" hidden></p><div id="sceneArea"><div id="scene" aria-label="Search scene"></div></div></section></main>
