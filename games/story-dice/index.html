<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Story Dice | Sunny & Stacy Games</title><link rel="icon" href="../../shared/brand-mark.png"><link rel="stylesheet" href="../../shared/styles.css"><link rel="stylesheet" href="../../shared/game-shell.css"><link rel="stylesheet" href="../dobble/themes.css"><link rel="stylesheet" href="game.css"><script type="module" src="game.js"></script><script type="module" src="../../shared/game-shell.js"></script><script type="module" src="../../shared/app.js"></script></head><body class="dobble-page dice-page"><aside class="game-shell" data-game-shell data-open="false" aria-label="Game navigation"><button class="drawer-handle" aria-label="Game menu" aria-expanded="false" aria-controls="gameNavigation">›</button><div class="drawer-panel" id="gameNavigation" inert><a class="brand" href="../../"><img class="brand-icon" src="../../shared/brand-mark.png" alt=""><span>Sunny & Stacy<small>GAMES</small></span></a><nav aria-label="Game controls"><a class="button" href="../../sets/">My Sets</a><button id="settingsOpen">⚙ Settings</button><button id="fullscreen">⛶ <span>Fullscreen</span></button><button id="copyLink">Copy Game Link</button></nav><div class="drawer-footer" data-app-version></div></div></aside>
<main><header class="dice-heading"><div><h1>Story Dice</h1><p id="modeName">Roll a little inspiration.</p></div><button id="modeOpen">Change mode</button></header><p id="error" role="alert" hidden></p><section id="table" aria-label="Dice table" tabindex="0"><p id="empty">An empty table. A thousand possible stories.<br>Press +1 to begin.</p></section><footer class="dice-controls"><div id="grammar" hidden><label>Time<select id="time"><option>Present</option><option>Past</option><option>Future</option><option>All</option></select></label><label>Aspect<select id="aspect"><option>Simple</option><option>Continuous</option><option>Perfect</option><option>All</option></select></label></div><div id="addControls"></div><div class="table-actions"><button id="clear">Clear</button><span id="status" role="status" aria-live="polite"></span></div></footer></main>
<dialog id="setup" aria-labelledby="setupTitle"><form id="setupForm"><h2 id="setupTitle">Set up Story Dice</h2><label>Mode<select id="mode"><option value="story">Story</option><option value="concept">Concept</option><option value="sentence">Sentence</option></select></label><label id="setLabel">Content Set<select id="setSelect"></select></label><p id="compatibility" role="status"></p><label>Theme<select id="theme"></select></label><label><input id="sound" type="checkbox"> Sound</label><p id="modeHelp"></p><div class="dialog-actions"><a class="button" href="../../">Games</a><button type="button" id="cancel">Cancel</button><button id="play" class="primary">Play</button></div></form></dialog>
<dialog id="preferences" aria-labelledby="prefTitle"><form id="prefForm"><h2 id="prefTitle">Game settings</h2><p>Your dice stay on the table.</p><label>Theme<select id="liveTheme"></select></label><label><input type="checkbox" id="liveSound"> Sound</label><div class="dialog-actions"><button id="prefCancel" type="button">Cancel</button><button class="primary">Done</button></div></form></dialog></body></html>
