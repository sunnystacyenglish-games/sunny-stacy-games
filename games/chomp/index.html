<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CHOMP! | Sunny & Stacy Games</title><link rel="icon" href="../../shared/brand-mark.png"><link rel="stylesheet" href="../../shared/styles.css"><link rel="stylesheet" href="../../shared/game-shell.css"><link rel="stylesheet" href="../dobble/themes.css"><link rel="stylesheet" href="game.css"><script type="module" src="game.js"></script><script type="module" src="../../shared/game-shell.js"></script><script type="module" src="../../shared/app.js"></script><link rel="stylesheet" href="../../shared/game-system.css"><script type="module" src="../../shared/selection-controls.js"></script><link rel="stylesheet" href="../../shared/setup-menu.css"><link rel="stylesheet" href="../../shared/tasks/presenter.css"></head><body class="dobble-page chomp-page"><aside class="game-shell" data-game-shell data-open="false" aria-label="Game navigation"><button class="drawer-handle" aria-label="Game menu" aria-expanded="false" aria-controls="gameNavigation">›</button><div class="drawer-panel" id="gameNavigation" inert><a class="brand" href="../../"><img class="brand-icon" src="../../shared/brand-mark.png" alt=""><span>Sunny & Stacy<small>GAMES</small></span></a><nav aria-label="Game controls"><a class="button" href="../../sets/">My Content</a><button id="settingsOpen">⚙ Settings</button><button id="fullscreen">⛶ <span>Fullscreen</span></button><button id="copyLink">Copy Game Link</button></nav><div class="drawer-footer" data-app-version></div></div></aside>
<main><div class="game-header"><h1>CHOMP!</h1><span id="context"></span></div><p id="error" role="alert" hidden></p><section id="welcome"><h2>Say it. Pick a tooth. CHOMP!</h2><button id="setupOpen" class="primary">Set up game</button></section><section id="playArea" hidden><div id="players" class="players"></div><p id="turn" role="status" aria-live="polite"></p><div class="chomp-layout"><section id="taskPanel" aria-label="Learning task"><div id="conceptTask"><div id="taskImage"></div><p id="taskText"></p><button id="reveal">Reveal Answer</button></div><div id="authoredTask"></div><div class="teacher-actions"><button id="incorrect">Incorrect</button><button id="correct" class="primary">Correct</button><button id="done" class="primary">Done / Continue</button></div><p id="waiting" hidden>Choose one available tooth.</p></section><section id="creaturePanel" aria-label="Creature"><div id="creature"></div></section></div></section></main>
<dialog id="setup" aria-labelledby="setupTitle"><form id="setupForm"><h2 id="setupTitle">Set up CHOMP!</h2><label>Content Set<select id="setSelect"></select></label><label id="blurLabel">Concept Blur<select id="taskMode"><option value="none">None</option><option value="word-blur">Word Blur</option><option value="picture-blur">Picture Blur</option></select></label><label>Theme<select id="themeSelect"></select></label><label class="sound-option"><input id="sound" type="checkbox"> Sound</label><section id="playerSetup"><label>Players / teams<select id="playerCount"><option>1</option><option selected>2</option><option>3</option><option>4</option></select></label><div id="names"></div></section><p id="setupError" role="alert"></p><div class="dialog-actions"><button id="cancelSetup" type="button">Cancel</button><button id="play" class="primary">Play</button></div></form></dialog>
<dialog id="result" aria-labelledby="resultTitle"><h2 id="resultTitle">CHOMP!</h2><p id="resultText"></p><button id="again" class="primary">Play Again</button><a href="../../" class="button">Exit</a></dialog></body></html>
