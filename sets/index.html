<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Content · Sunny & Stacy Games</title><link rel="icon" href="../shared/brand-mark.png"><link rel="stylesheet" href="../shared/styles.css"><link rel="stylesheet" href="../shared/teacher.css"><link rel="stylesheet" href="library.css"><script type="module" src="library.js"></script><script type="module" src="../shared/app.js"></script></head><body>
<header><a class="brand" href="../"><span class="sun">☀</span>Sunny & Stacy Games</a><nav aria-label="Main navigation"><a href="../">Games</a><a href="./" aria-current="page">My Content</a></nav></header>
<main class="teacher"><div class="section-heading"><div><div class="eyebrow">Your teaching library</div><h1>My Content</h1></div><div class="row"><button id="importButton">Import JSON</button><input id="importFile" type="file" accept="application/json,.json" hidden><button class="primary" id="create">+ Create</button></div></div>
<p id="message" class="notice" role="status" hidden></p><nav id="libraryPath" aria-label="Library location"></nav>
<div class="library-toolbar"><label class="library-search">Search<input id="search" type="search" placeholder="Search content by name" aria-describedby="searchScope"></label><label>Content type<select id="typeFilter"><option value="">All Types</option></select></label><label>Sort<select id="sort"><option value="edited">Recently Edited</option><option value="created">Recently Created</option><option value="az">Name A–Z</option><option value="za">Name Z–A</option></select></label><button id="createFolder">+ New folder</button></div>
<p id="searchScope" class="help"></p><div id="libraryGrid" class="library-grid"></div><p id="emptyLibrary" class="empty-state" role="status" hidden></p><p class="storage-note">Content, folders and uploaded images stay in this browser on this computer. Export JSON to back up content or move it to another browser.</p></main>
<dialog id="createContent" class="app-dialog" aria-label="Create content"><h2>Create content</h2><div class="content-types"></div><button id="cancelCreate">Cancel</button></dialog></body></html>
